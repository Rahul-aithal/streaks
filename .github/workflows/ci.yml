# CI on every pull request to dev and main, and on every push to main. (A push to
# dev is covered by its pull request; running both doubled every check.) A push to main also
# migrates the production database and deploys the Worker. Render deploys the
# API itself once every check here passes (autoDeployTrigger: checksPass).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a production deploy halfway; cancel stale CI runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  api:
    name: API (vet, test, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: streaks
          POSTGRES_PASSWORD: streaks
          POSTGRES_DB: streaks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U streaks"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # A throwaway database, so the integration tests run too.
      DATABASE_URL_DIRECT: postgres://streaks:streaks@localhost:5432/streaks?sslmode=disable
      TEST_DATABASE_URL: postgres://streaks:streaks@localhost:5432/streaks?sslmode=disable
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go vet ./...
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: Migrate the test database
        run: go run ./cmd/streaks migrate up
      # -p 1: the integration tests in different packages share one database.
      - run: go test -p 1 ./...
      - run: go build -trimpath -o /dev/null ./cmd/streaks

  web:
    # The name is a required status check in branch protection, so it stays as is even
    # though this job also runs the tests.
    name: Web and Worker (typecheck, lint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web typecheck
      - run: pnpm --filter worker typecheck
      - run: pnpm exec oxlint apps/web/src apps/worker/src
      # Fails below 100% coverage of the files listed in each vitest.config.ts.
      - run: pnpm --filter web test
      - run: pnpm --filter worker test
      - run: pnpm --filter web build
      # Bundles the Worker and checks wrangler.jsonc exactly as a deploy would,
      # without uploading, so a broken Worker fails the PR rather than main.
      - name: Worker deploy dry run
        run: pnpm --filter worker exec wrangler deploy --dry-run --outdir dist

  migrate:
    name: Migrate production database
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web]
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum
      - run: go run ./cmd/streaks migrate up
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}

  deploy-worker:
    name: Deploy Worker
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://streaks.devaithal.tech
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter worker run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
